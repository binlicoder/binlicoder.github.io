name: 发布博客

# 源码在 source 分支，编译产物推送到 main，由 GitHub Pages 提供访问。
on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 获取博客源码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 生成博客
        run: pnpm exec hexo generate

      - name: 同步网页到 main 分支
        run: |
          git fetch origin main
          git worktree add --detach "$RUNNER_TEMP/blog-pages" origin/main
          rsync -a --delete --exclude=.git public/ "$RUNNER_TEMP/blog-pages/"
          touch "$RUNNER_TEMP/blog-pages/.nojekyll"
          cd "$RUNNER_TEMP/blog-pages"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "页面没有变化，跳过提交"
          else
            git commit -m "更新博客页面"
            git push origin HEAD:main
          fi
